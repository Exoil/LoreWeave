openapi: 3.0.3
info:
  title: LoreWeave Character API
  version: 2.0.0
servers:
  - url: https://localhost:7048
tags:
  - name: Boards
    description: Boards — one graph per RPG game; carries the name and visual configuration.
  - name: Characters
    description: Characters living on a board.
  - name: Relations
    description: KNOWS relationships between characters and path finding through them.
  - name: Facts
    description: Facts and their HAS_FACT connections to characters.
paths:
  /v1/boards:
    get:
      summary: Get all boards
      operationId: getBoards
      tags: [ Boards ]
      responses:
        '200':
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: '#/components/schemas/BoardDto'
              examples:
                boards:
                  summary: Two boards with different styling
                  value:
                    - id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                      name: "Curse of Strahd"
                      configuration:
                        characterNodeColor: "#4466cc"
                        factNodeColor: "#d97706"
                        relationEdgeColor: "#aaaaaa"
                        factEdgeColor: "#d9a066"
                        pathHighlightColor: "#a855f7"
                        nodeRadius: 16
                        edgeWidth: 3
                        curvedEdges: true
                        showGrid: true
                        scalingObjects: true
                    - id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
                      name: "Waterdeep"
                      configuration:
                        characterNodeColor: "#166534"
                        factNodeColor: "#9f1239"
                        relationEdgeColor: "#64748b"
                        factEdgeColor: "#f59e0b"
                        pathHighlightColor: "#7c3aed"
                        nodeRadius: 20
                        edgeWidth: 4
                        curvedEdges: false
                        showGrid: false
                        scalingObjects: false
    post:
      summary: Create a board
      description: >-
        Creates a new board (one graph per RPG game). The board starts with
        the server-side default configuration; use updateBoard to customise it.
      operationId: createBoard
      tags: [ Boards ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardDto'
            examples:
              standard:
                summary: Minimal valid create
                value:
                  name: "Curse of Strahd"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
              example: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/boards/{boardId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      summary: Get board by id
      operationId: getBoardById
      tags: [ Boards ]
      responses:
        '200':
          description: Board found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDto'
              examples:
                standard:
                  summary: A board with custom styling
                  value:
                    id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
                    name: "Curse of Strahd"
                    configuration:
                      characterNodeColor: "#4466cc"
                      factNodeColor: "#d97706"
                      relationEdgeColor: "#aaaaaa"
                      factEdgeColor: "#d9a066"
                      pathHighlightColor: "#a855f7"
                      nodeRadius: 16
                      edgeWidth: 3
                      curvedEdges: true
                      showGrid: true
                      scalingObjects: true
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update board name and configuration
      operationId: updateBoard
      tags: [ Boards ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBoardDto'
            examples:
              standard:
                summary: Rename and restyle the board
                value:
                  name: "Curse of Strahd — Act II"
                  configuration:
                    characterNodeColor: "#166534"
                    factNodeColor: "#9f1239"
                    relationEdgeColor: "#64748b"
                    factEdgeColor: "#f59e0b"
                    pathHighlightColor: "#7c3aed"
                    nodeRadius: 20
                    edgeWidth: 4
                    curvedEdges: false
                    showGrid: false
                    scalingObjects: true
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      summary: Delete a board and everything on it
      description: >-
        Deletes the board together with all characters, relations and facts
        that belong to it.
      operationId: deleteBoard
      tags: [ Boards ]
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/boards/{boardId}/characters:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      summary: Get paged characters
      operationId: getPagedCharacters
      tags: [ Characters ]
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortType'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/NameFilter'
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: '#/components/schemas/CharacterPayloadWithRelations'
              examples:
                page:
                  summary: One page with relations and facts
                  value:
                    - id: "0b6c1f8a-9c2e-4a18-93a5-3a5e3a5e3a5e"
                      name: "Gandalf"
                      knowCharacters:
                        - characterId: "11111111-1111-4111-8111-111111111111"
                          description: "Met in the Shire"
                          isStrongRelation: true
                      facts:
                        - id: "33333333-3333-4333-8333-333333333333"
                          title: "Wizard of the Secret Fire"
                          content: "Wielder of Narya, one of the three Elven rings."
                    - id: "11111111-1111-4111-8111-111111111111"
                      name: "Frodo"
                      knowCharacters: [ ]
                      facts: [ ]
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Create a character
      operationId: createCharacter
      tags: [ Characters ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /v1/boards/{boardId}/characters/{id}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getCharacterById
      tags: [ Characters ]
      summary: Get character by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Character found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCharacter
      tags: [ Characters ]
      summary: Update character
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCharacterDto'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteCharacter
      tags: [ Characters ]
      summary: Delete character
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/boards/{boardId}/characters/knows:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      operationId: createKnowRelationship
      tags: [ Relations ]
      summary: Create a knowledge relationship between characters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowsDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /v1/boards/{boardId}/characters/path/{from}/to/{to}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: findRelationBetweenCharacters
      tags: [ Relations ]
      summary: Find shortest path between two characters through KNOWS relationships
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
        - name: maxHops
          in: query
          required: false
          description: Maximum number of hops to traverse (default 10)
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Path found or empty path if no connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationPathPayload'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/boards/{boardId}/characters/knows/{from}/to/{to}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getKnowRelationship
      tags: [ Relations ]
      summary: Get the knowledge relationship between two characters
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Knowledge relationship found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowRelationPayload'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateKnowRelationship
      tags: [ Relations ]
      summary: Update a knowledge relationship between characters
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowsDto'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteKnowRelationship
      tags: [ Relations ]
      summary: Delete a knowledge relationship
      parameters:
        - name: from
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/boards/{boardId}/characters/{id}/facts:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      operationId: addFactToCharacter
      tags: [ Facts ]
      summary: Add a fact to a character.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: '#/components/schemas/CreateFactDto'
      responses:
          '201':
              description: Created
              content:
                  application/json:
                      schema:
                          type: string
                          format: uuid
          '400':
              $ref: '#/components/responses/BadRequest'
          '404':
              $ref: '#/components/responses/NotFound'
              
  /v1/boards/{boardId}/facts/{id}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      operationId: getFact
      tags: [ Facts ]
      summary: Get a fact by id.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fact found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactDto'
              examples:
                standard:
                  summary: A fact of a character
                  value:
                    id: "0b6c1f8a-9c2e-4a18-93a5-3a5e3a5e3a5e"
                    title: "Bearer of the One Ring"
                    content: "Carried the One Ring from the Shire to Mount Doom."
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateFact
      tags: [ Facts ]
      summary: Update a fact.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactDto'
            examples:
              standard:
                summary: Update title and content
                value:
                  title: "Bearer of the One Ring"
                  content: "Carried the One Ring from the Shire to Mount Doom."
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteFact
      tags: [ Facts ]
      summary: Delete a fact by id.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/boards/{boardId}/characters/{characterId}/facts/{factId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    put:
      operationId: connectFactToCharacter
      tags: [ Facts ]
      summary: Connect an existing fact to an existing character.
      description: >-
        Creates a HAS_FACT connection between the character and the fact.
        A character can never be connected twice to the same fact —
        connecting an already connected pair returns 409 Conflict.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/FactId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: disconnectFactFromCharacter
      tags: [ Facts ]
      summary: Delete the connection between a character and a fact.
      description: >-
        Removes the HAS_FACT connection between the character and the fact.
        The fact itself is not deleted. Returns 404 when the character, the
        fact, or the connection does not exist.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/FactId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

components:
  headers:
    ETag:
      description: >-
        Entity tag representing the current version. Quoted unsigned 16-bit
        integer, e.g. "1" .. "65535".
      schema:
        type: string
        minLength: 3
        maxLength: 7
  parameters:
    BoardId:
      name: boardId
      in: path
      required: true
      description: Board identifier (one board per RPG game)
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      description: Character identifier
      schema:
        type: string
        format: uuid
    CharacterId:
      name: characterId
      in: path
      required: true
      description: Character identifier
      schema:
        type: string
        format: uuid
    FactId:
      name: factId
      in: path
      required: true
      description: Fact identifier
      schema:
        type: string
        format: uuid
    PageNumber:
      name: pageNumber
      in: query
      required: true
      description: Page number (0-based or 1-based depending on server configuration)
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    PageSize:
      name: pageSize
      in: query
      required: true
      description: Page size
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
    SortType:
      name: sortType
      in: query
      required: true
      description: Field to sort by
      schema:
        type: string
        minLength: 0
        maxLength: 50
        pattern: "^(name|id)$"
    SortOrder:
      name: sortOrder
      in: query
      required: true
      description: Sort direction (e.g., asc, desc)
      schema:
        type: string
        minLength: 3
        maxLength: 4
        pattern: "^(Asc|Desc)$"
    NameFilter:
      name: nameFilter
      in: query
      required: false
      description: Filter for character name.
      schema:
        type: string
        minLength: 0
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The ETag version to match, as an unsigned 16-bit integer (1..65535),
        optionally quoted.
      schema:
        type: string
        minLength: 1
        maxLength: 7
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The specified resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Precondition Failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      title: ProblemDetails
      properties:
        type:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        title:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          nullable: true
        detail:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        instance:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
      additionalProperties: true
    BoardConfigurationDto:
      title: BoardConfigurationDto
      description: >-
        Per-board visual configuration of the graph. Colours are 6-digit hex
        values; the remaining fields map onto v-network-graph view options.
      type: object
      required:
        [
          characterNodeColor,
          factNodeColor,
          relationEdgeColor,
          factEdgeColor,
          pathHighlightColor,
          nodeRadius,
          edgeWidth,
          curvedEdges,
          showGrid,
          scalingObjects,
        ]
      properties:
        characterNodeColor:
          type: string
          description: Fill colour of character nodes (hex, e.g. "#4466cc")
          pattern: "^#[0-9a-fA-F]{6}$"
          minLength: 7
          maxLength: 7
        factNodeColor:
          type: string
          description: Fill colour of fact nodes (hex)
          pattern: "^#[0-9a-fA-F]{6}$"
          minLength: 7
          maxLength: 7
        relationEdgeColor:
          type: string
          description: Colour of character-to-character relation edges (hex)
          pattern: "^#[0-9a-fA-F]{6}$"
          minLength: 7
          maxLength: 7
        factEdgeColor:
          type: string
          description: Colour of character-to-fact connection edges (hex)
          pattern: "^#[0-9a-fA-F]{6}$"
          minLength: 7
          maxLength: 7
        pathHighlightColor:
          type: string
          description: Colour of nodes/edges on a found relation path (hex)
          pattern: "^#[0-9a-fA-F]{6}$"
          minLength: 7
          maxLength: 7
        nodeRadius:
          type: integer
          format: int32
          description: Radius of character nodes in pixels (fact nodes scale down proportionally)
          minimum: 8
          maximum: 48
        edgeWidth:
          type: integer
          format: int32
          description: Stroke width of relation edges in pixels
          minimum: 1
          maximum: 12
        curvedEdges:
          type: boolean
          description: Render edges as curves (true) or straight lines (false)
        showGrid:
          type: boolean
          description: Whether the background grid is visible
        scalingObjects:
          type: boolean
          description: Whether zooming scales nodes/edges/labels together like a map
    BoardDto:
      title: BoardDto
      type: object
      required: [ id, name, configuration ]
      properties:
        id:
          type: string
          description: Board identifier
          format: uuid
        name:
          type: string
          description: Board name (typically the RPG game/world name)
          minLength: 1
          maxLength: 50
        configuration:
          $ref: '#/components/schemas/BoardConfigurationDto'
    CreateBoardDto:
      title: CreateBoardDto
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: Board name (typically the RPG game/world name)
          minLength: 1
          maxLength: 50
    UpdateBoardDto:
      title: UpdateBoardDto
      type: object
      required: [ name, configuration ]
      properties:
        name:
          type: string
          description: Board name (typically the RPG game/world name)
          minLength: 1
          maxLength: 50
        configuration:
          $ref: '#/components/schemas/BoardConfigurationDto'
    CharacterDto:
      title: CharacterDto
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          description: Character identifier
          format: uuid
        name:
          type: string
          description: Character name
          minLength: 1
          maxLength: 50
    CharacterPayloadWithRelations:
      type: object
      title: CharacterPayloadWithRelations
      required: [ id, name, knowCharacters, facts ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        knowCharacters:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/KnowCharacterRelationPayload'
        facts:
          type: array
          description: Facts connected to the character via HAS_FACT
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/CharacterFactPayload'
    CharacterFactPayload:
      type: object
      title: CharacterFactPayload
      required: [ id, title, content ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 3000
    KnowCharacterRelationPayload:
      type: object
      title: KnowCharacterRelationPayload
      required: [ characterId, description, isStrongRelation ]
      properties:
        characterId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    
    KnowRelationPayload:
      title: KnowRelationPayload
      description: >-
        The current version is returned in the ETag response header,
        not in the body.
      type: object
      required: [ fromCharacterId, toCharacterId, description, isStrongRelation ]
      properties:
        fromCharacterId:
          type: string
          format: uuid
        toCharacterId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    RelationPathPayload:
      title: RelationPathPayload
      type: object
      required: [ characterIds, hops ]
      properties:
        characterIds:
          type: array
          description: Ordered list of character IDs forming the path from source to target
          minItems: 0
          maxItems: 50
          items:
            type: string
            format: uuid
        hops:
          type: integer
          format: int32
          description: Number of relationships traversed (characterIds.length - 1)
          minimum: 0
          maximum: 50
    CreateCharacterDto:
      type: object
      title: CreateCharacterDto
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    UpdateCharacterDto:
      title: UpdateCharacterDto
