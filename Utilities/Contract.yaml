openapi: 3.0.3
info:
  title: LoreWeave Character API
  version: 1.0.1
servers:
  - url: https://localhost:7048
paths:
  /v1/characters:
    get:
      summary: Get paged characters
      operationId: getPagedCharacters
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortType'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/NameFilter'
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: '#/components/schemas/CharacterPayloadWithRelations'
              examples:
                page:
                  summary: One page with relations and facts
                  value:
                    - id: "0b6c1f8a-9c2e-4a18-93a5-3a5e3a5e3a5e"
                      name: "Gandalf"
                      knowCharacters:
                        - characterId: "11111111-1111-4111-8111-111111111111"
                          description: "Met in the Shire"
                          isStrongRelation: true
                      facts:
                        - id: "33333333-3333-4333-8333-333333333333"
                          title: "Wizard of the Secret Fire"
                          content: "Wielder of Narya, one of the three Elven rings."
                    - id: "11111111-1111-4111-8111-111111111111"
                      name: "Frodo"
                      knowCharacters: [ ]
                      facts: [ ]
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Create a character
      operationId: createCharacter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /v1/characters/{id}:
    get:
      operationId: getCharacterById
      summary: Get character by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Character found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCharacter
      summary: Update character
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCharacterDto'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteCharacter
      summary: Delete character
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/characters/knows:
    post:
      operationId: createKnowRelationship
      summary: Create a knowledge relationship between characters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowsDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /v1/characters/path/{from}/to/{to}:
    get:
      operationId: findRelationBetweenCharacters
      summary: Find shortest path between two characters through KNOWS relationships
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
        - name: maxHops
          in: query
          required: false
          description: Maximum number of hops to traverse (default 10)
          schema:
            type: integer
            format: int32
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Path found or empty path if no connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationPathPayload'
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/characters/knows/{from}/to/{to}:
    get:
      operationId: getKnowRelationship
      summary: Get the knowledge relationship between two characters
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Knowledge relationship found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowRelationPayload'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateKnowRelationship
      summary: Update a knowledge relationship between characters
      parameters:
        - name: from
          in: path
          required: true
          description: Source character identifier
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          description: Target character identifier
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowsDto'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteKnowRelationship
      summary: Delete a knowledge relationship
      parameters:
        - name: from
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: to
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  
  /v1/characters/{id}/facts:
    put:
      operationId: addFactToCharacter
      summary: Add a fact to a character.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: '#/components/schemas/CreateFactDto'
      responses:
          '201':
              description: Created
              content:
                  application/json:
                      schema:
                          type: string
                          format: uuid
          '400':
              $ref: '#/components/responses/BadRequest'
          '404':
              $ref: '#/components/responses/NotFound'
              
  /v1/facts/{id}:
    get:
      operationId: getFact
      summary: Get a fact by id.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Fact found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactDto'
              examples:
                standard:
                  summary: A fact of a character
                  value:
                    id: "0b6c1f8a-9c2e-4a18-93a5-3a5e3a5e3a5e"
                    title: "Bearer of the One Ring"
                    content: "Carried the One Ring from the Shire to Mount Doom."
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateFact
      summary: Update a fact.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactDto'
            examples:
              standard:
                summary: Update title and content
                value:
                  title: "Bearer of the One Ring"
                  content: "Carried the One Ring from the Shire to Mount Doom."
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      operationId: deleteFact
      summary: Delete a fact by id.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/characters/{characterId}/facts/{factId}:
    put:
      operationId: connectFactToCharacter
      summary: Connect an existing fact to an existing character.
      description: >-
        Creates a HAS_FACT connection between the character and the fact.
        A character can never be connected twice to the same fact —
        connecting an already connected pair returns 409 Conflict.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/FactId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: disconnectFactFromCharacter
      summary: Delete the connection between a character and a fact.
      description: >-
        Removes the HAS_FACT connection between the character and the fact.
        The fact itself is not deleted. Returns 404 when the character, the
        fact, or the connection does not exist.
      parameters:
        - $ref: '#/components/parameters/CharacterId'
        - $ref: '#/components/parameters/FactId'
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'

components:
  headers:
    ETag:
      description: >-
        Entity tag representing the current version. Quoted unsigned 16-bit
        integer, e.g. "1" .. "65535".
      schema:
        type: string
        minLength: 3
        maxLength: 7
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Character identifier
      schema:
        type: string
        format: uuid
    CharacterId:
      name: characterId
      in: path
      required: true
      description: Character identifier
      schema:
        type: string
        format: uuid
    FactId:
      name: factId
      in: path
      required: true
      description: Fact identifier
      schema:
        type: string
        format: uuid
    PageNumber:
      name: pageNumber
      in: query
      required: true
      description: Page number (0-based or 1-based depending on server configuration)
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    PageSize:
      name: pageSize
      in: query
      required: true
      description: Page size
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
    SortType:
      name: sortType
      in: query
      required: true
      description: Field to sort by
      schema:
        type: string
        minLength: 0
        maxLength: 50
        pattern: "^(name|id)$"
    SortOrder:
      name: sortOrder
      in: query
      required: true
      description: Sort direction (e.g., asc, desc)
      schema:
        type: string
        minLength: 3
        maxLength: 4
        pattern: "^(Asc|Desc)$"
    NameFilter:
      name: nameFilter
      in: query
      required: false
      description: Filter for character name.
      schema:
        type: string
        minLength: 0
        maxLength: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The ETag version to match, as an unsigned 16-bit integer (1..65535),
        optionally quoted.
      schema:
        type: string
        minLength: 1
        maxLength: 7
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The specified resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Precondition Failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      title: ProblemDetails
      properties:
        type:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        title:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          nullable: true
        detail:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
        instance:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true
      additionalProperties: true
    CharacterDto:
      title: CharacterDto
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          description: Character identifier
          format: uuid
        name:
          type: string
          description: Character name
          minLength: 1
          maxLength: 50
    CharacterPayloadWithRelations:
      type: object
      title: CharacterPayloadWithRelations
      required: [ id, name, knowCharacters, facts ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        knowCharacters:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/KnowCharacterRelationPayload'
        facts:
          type: array
          description: Facts connected to the character via HAS_FACT
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/CharacterFactPayload'
    CharacterFactPayload:
      type: object
      title: CharacterFactPayload
      required: [ id, title, content ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 3000
    KnowCharacterRelationPayload:
      type: object
      title: KnowCharacterRelationPayload
      required: [ characterId, description, isStrongRelation ]
      properties:
        characterId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    
    KnowRelationPayload:
      title: KnowRelationPayload
      description: >-
        The current version is returned in the ETag response header,
        not in the body.
      type: object
      required: [ fromCharacterId, toCharacterId, description, isStrongRelation ]
      properties:
        fromCharacterId:
          type: string
          format: uuid
        toCharacterId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    RelationPathPayload:
      title: RelationPathPayload
      type: object
      required: [ characterIds, hops ]
      properties:
        characterIds:
          type: array
          description: Ordered list of character IDs forming the path from source to target
          minItems: 0
          maxItems: 50
          items:
            type: string
            format: uuid
        hops:
          type: integer
          format: int32
          description: Number of relationships traversed (characterIds.length - 1)
          minimum: 0
          maximum: 50
    CreateCharacterDto:
      type: object
      title: CreateCharacterDto
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    UpdateCharacterDto:
      title: UpdateCharacterDto
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    CreateKnowsDto:
      title: CreateKnowsDto
      type: object
      required: [ fromCharacterId, toCharacterId, description, isStrongRelation ]
      properties:
        fromCharacterId:
          type: string
          format: uuid
        toCharacterId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    UpdateKnowsDto:
      title: UpdateKnowsDto
      type: object
      required: [ description, isStrongRelation ]
      properties:
        description:
          type: string
          minLength: 0
          maxLength: 256
        isStrongRelation:
          type: boolean
    CreateFactDto:
      title: CreateFactDto
      type: object
      required: [ title, content ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 3000
    UpdateFactDto:
      title: UpdateFactDto
      type: object
      required: [ title, content ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 3000
    FactDto:
      title: FactDto
      type: object
      required: [ id, title, content ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 3000
