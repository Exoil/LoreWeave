name: Backend Tests & Sonar Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write # SonarCloud PR decoration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Forked PRs have no access to SONAR_TOKEN, so analysis is skipped there.
  # Tests still run in that case.
  RUN_SONAR: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
  SONAR_SCANNER_VERSION: '11.2.1'
  DOTNET_COVERAGE_VERSION: '18.9.0'

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs full history for blame / new-code detection

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Java 21 is the runtime SonarQube Cloud requires for its scanners; 17 is
      # deprecated and newer JDKs are not on the supported list, so pin 21.
      - name: Setup Java
        if: env.RUN_SONAR == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache SonarCloud packages
        if: env.RUN_SONAR == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ env.SONAR_SCANNER_VERSION }}
          restore-keys: ${{ runner.os }}-sonar-

      # --allow-roll-forward: the tools target an older TFM than the .NET 10
      # runtime installed above, so they need permission to roll forward.
      - name: Install SonarScanner for .NET
        if: env.RUN_SONAR == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version ${{ env.SONAR_SCANNER_VERSION }} --allow-roll-forward

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version ${{ env.DOTNET_COVERAGE_VERSION }} --allow-roll-forward

      - name: Restore dependencies
        run: dotnet restore

      # sonar.cs.vstest.reportsPaths feeds the TRX files produced below, so Sonar
      # reports test execution (count, failures, duration) next to coverage
      # instead of showing "0 unit tests".
      #
      # sonar.sources / sonar.tests are deliberately NOT set: the .NET scanner
      # derives them from the MSBuild projects it observes (IsTestProject /
      # Microsoft.NET.Test.Sdk), and overriding them makes it index files twice.
      - name: Begin Sonar analysis
        if: env.RUN_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"Exoil_LoreWeave" \
            /o:"exoil" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage-unit.xml,coverage-integration.xml" \
            /d:sonar.cs.vstest.reportsPaths="test-results/**/*.trx"

      # --no-incremental: Sonar only analyses projects that actually compile in
      # this build, so nothing may be skipped.
      # TreatWarningsAsErrors is relaxed only while Sonar is active: the scanner
      # injects SonarAnalyzer.CSharp, whose rule warnings would otherwise be
      # promoted to errors by Directory.Build.props and fail the build.
      - name: Build
        run: dotnet build --no-restore --no-incremental --configuration Debug -p:TreatWarningsAsErrors=${{ env.RUN_SONAR == 'true' && 'false' || 'true' }}

      - name: Run unit tests
        run: |
          dotnet-coverage collect \
            --output coverage-unit.xml \
            --output-format xml \
            "dotnet test --filter Category=Unit --no-build --configuration Debug --verbosity normal --logger trx --results-directory test-results/unit"

      - name: Run integration tests
        run: |
          dotnet-coverage collect \
            --output coverage-integration.xml \
            --output-format xml \
            "dotnet test --filter Category=Integration --no-build --configuration Debug --verbosity normal --logger trx --results-directory test-results/integration"

      - name: End Sonar analysis
        if: env.RUN_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end